<!doctype html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{.Title}}</title>
  <meta name="description" content="{{.Description}}">
  {{if .Keywords}}<meta name="keywords" content="{{.Keywords}}">{{end}}
  <link rel="canonical" href="{{.Canonical}}">
  <link rel="stylesheet" href="/core/style.css">
  <link rel="icon" href="/img/icon-192.png" type="image/png" sizes="192x192">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">

  <!-- Open Graph / 社交分享 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{.SiteName}}">
  <meta property="og:title" content="{{.Title}}">
  <meta property="og:description" content="{{.Description}}">
  <meta property="og:url" content="{{.Canonical}}">
  {{if .OGImage}}<meta property="og:image" content="{{.SiteURL}}{{.OGImage}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{.SiteURL}}{{.OGImage}}">{{else}}
  <meta name="twitter:card" content="summary">{{end}}
  <meta name="twitter:title" content="{{.Title}}">
  <meta name="twitter:description" content="{{.Description}}">

  <!-- Impact-Site-Verification: 0513be55-7135-4b38-aea3-6748698a9a89 -->
  <meta name="Impact-Site-Verification" content="0513be55-7135-4b38-aea3-6748698a9a89">
  {{.JSONLD}}
</head>
<body>
  <span style="display:none" aria-hidden="true">Impact-Site-Verification: 0513be55-7135-4b38-aea3-6748698a9a89</span>
  <div id="app">
    <noscript>
      <h1>{{.SiteName}}</h1>
      <p>{{.Description}}</p>
      {{.NoscriptHTML}}
    </noscript>
  </div>
  <script type="module" src="/core/app.js"></script>
</body>
</html>
